name: Quality Gate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.8
      - run: bun install --frozen-lockfile
      - run: bun run type-check
      - run: bun run test
      - run: bun run --cwd packages/theme verify
      - run: bun run --cwd packages/request-core verify
      - run: bun run --cwd packages/layout verify
